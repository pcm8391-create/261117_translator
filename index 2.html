<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>텍스트 번역기</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 군더더기 없는 업무용 도구, 열면 바로 번역
   IDEA: 두 칸짜리 대역 노트처럼 원문과 번역문이 나란히 놓임
   PICTURE: 번역기 자체. 왼쪽 원문 칸, 오른쪽 번역문 칸, 위에 언어 선택줄
   COLOUR and TYPE: 코발트 #1240e0 제목 띠, 흰 바탕, 옅은 #eef2ff 구역, 밤 #0a0d18 / Space Grotesk + Noto Sans KR
   LAYOUT: 얇은 제목 띠 → 언어·말투 선택줄 → 두 칸 → 최근 번역 */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0a0d18);--ink:light-dark(#0b0f1a,#e9ecf7);--mute:light-dark(#566079,#9aa3ba);--zone:light-dark(#eef2ff,#131a30);--line:light-dark(#d3dbf5,#252e4d);--cob:#1240e0}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
.strip{background:var(--cob);color:#fff;padding:16px max(5vw,16px)}
.strip h1{margin:0;font:600 clamp(24px,3.4vw,32px)/1.1 "Space Grotesk","Noto Sans KR",sans-serif}
.band{max-width:1240px;margin:0 auto;padding:clamp(18px,3vw,36px) max(5vw,16px)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:14px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mute)}
select,textarea,button{font:inherit;font-size:16px;color:var(--ink)}
select{min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
button{min-height:44px;padding:8px 16px;border:1px solid var(--line);border-radius:8px;background:var(--zone);cursor:pointer}
button.pri{background:var(--cob);border-color:var(--cob);color:#fff;font-weight:700;min-width:120px}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--cob);outline-offset:2px}
.panes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.pane{border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
.pane .h{background:var(--zone);padding:4px 12px;font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:52px}
textarea,.out{flex:1;min-height:240px;padding:12px;border:0;background:var(--bg);line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
textarea{resize:vertical;width:100%}
textarea:focus-visible{outline-offset:-3px}
.out:empty::before{content:attr(data-ph);color:var(--mute)}
.meta{font-size:13px;color:var(--mute);padding:6px 12px;border-top:1px solid var(--line);min-height:32px}
.go{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:14px}
#st{color:var(--mute);font-size:14px}
.hist{margin-top:28px}
.hist h2{font:700 18px/1.2 "Noto Sans KR",sans-serif;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.hist ul{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.hist li+li{border-top:1px solid var(--line)}
.hist li button{width:100%;text-align:left;border:0;border-radius:0;background:var(--bg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist li button:hover{background:var(--zone)}
.note{color:var(--mute);font-size:13px;margin-top:20px}
@media(max-width:700px){.panes{grid-template-columns:minmax(0,1fr)}textarea,.out{min-height:160px}}
</style>
</head>
<body>
<header class="strip"><h1>텍스트 번역기</h1></header>
<main class="band">
  <div class="bar">
    <label class="f" for="from">원문 언어<select id="from"></select></label>
    <button id="swap" aria-label="원문과 번역 언어 서로 바꾸기" title="언어 바꾸기">⇄</button>
    <label class="f" for="to">번역 언어<select id="to"></select></label>
  </div>

  <div class="panes">
    <section class="pane" aria-label="원문">
      <div class="h"><span>원문</span><button id="clear">지우기</button></div>
      <textarea id="src" maxlength="1500" placeholder="번역할 문장을 입력하세요" aria-label="원문 입력"></textarea>
      <div class="meta" id="cnt">0 / 1500</div>
    </section>
    <section class="pane" aria-label="번역문">
      <div class="h"><span>번역문</span><button id="copy">복사</button></div>
      <div class="out" id="out" data-ph="번역 결과가 여기에 표시됩니다" aria-live="polite"></div>
      <div class="meta">Ctrl+Enter로 번역할 수 있습니다</div>
    </section>
  </div>

  <div class="go"><button class="pri" id="btn">번역</button><span id="st" role="status"></span></div>

  <section class="hist" id="histbox" hidden>
    <h2>최근 번역 <button id="hclear">기록 지우기</button></h2>
    <ul id="hist"></ul>
  </section>
  <p class="note">번역은 무료 공개 서비스(MyMemory)를 사용합니다. 입력한 문장이 해당 서비스로 전송되므로 개인정보나 내부 자료는 넣지 마세요. 하루 이용량 제한(접속 IP 기준 약 5,000자)이 있고, 품질은 AI 번역보다 낮을 수 있습니다. 중요한 문서는 사람이 검토한 뒤 사용하세요. 기록은 이 브라우저에만 저장됩니다.</p>
</main>

<script>
{
const $=id=>document.getElementById(id);
const L=[['ko','한국어'],['en','영어'],['ja','일본어'],['zh-CN','중국어(간체)'],['zh-TW','중국어(번체)'],['es','스페인어'],['fr','프랑스어'],['de','독일어'],['pt','포르투갈어'],['ru','러시아어'],['vi','베트남어'],['th','태국어'],['id','인도네시아어'],['ar','아랍어']];
const name=c=>(L.find(x=>x[0]===c)||[0,c])[1];
const store={get(k,d){try{const v=localStorage.getItem('tr-'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('tr-'+k,JSON.stringify(v))}catch(e){}}};
const opt=a=>a.map(([v,t])=>`<option value="${v}">${t}</option>`).join('');
$('from').innerHTML=opt([['auto','자동 감지 (문자 기준)']].concat(L));
$('to').innerHTML=opt(L);
const pref=store.get('pref',{from:'auto',to:'en'});
$('from').value=pref.from;$('to').value=pref.to;
if(!$('from').value)$('from').value='auto';if(!$('to').value)$('to').value='en';

let ctl=null,hist=store.get('hist',[]);
const setSt=m=>{$('st').textContent=m};
const count=()=>{$('cnt').textContent=$('src').value.length+' / 1500'};
const savePref=()=>store.set('pref',{from:$('from').value,to:$('to').value});
const bytes=s=>new TextEncoder().encode(s).length;

// 문자 종류로 원문 언어 추정. 라틴 문자는 영어로 봅니다(스페인어 등은 직접 선택).
function detect(t){
  if(/[\uAC00-\uD7AF]/.test(t))return 'ko';
  if(/[\u3040-\u30FF]/.test(t))return 'ja';
  if(/[\u4E00-\u9FFF]/.test(t))return 'zh-CN';
  if(/[\u0400-\u04FF]/.test(t))return 'ru';
  if(/[\u0E00-\u0E7F]/.test(t))return 'th';
  if(/[\u0600-\u06FF]/.test(t))return 'ar';
  if(/[ăâđêôơưĂÂĐÊÔƠƯạảấầẩẫậắằẳẵặẹẻẽếềểễệỉịọỏốồổỗộớờởỡợụủứừửữự]/.test(t))return 'vi';
  return 'en';
}

// MyMemory는 한 번에 500바이트까지만 받으므로 문장 단위로 나눕니다.
function split(text,max=450){
  const pieces=text.match(/[^.!?。！？\n]+[.!?。！？]*\n*|\n+/g)||[text];
  const out=[];let cur='';
  const push=p=>{
    if(bytes(cur+p)<=max){cur+=p;return}
    if(cur){out.push(cur);cur=''}
    if(bytes(p)<=max){cur=p;return}
    let b='';for(const ch of p){if(bytes(b+ch)>max){out.push(b);b=''}b+=ch}cur=b;
  };
  pieces.forEach(push);if(cur)out.push(cur);return out;
}
const dec=s=>{const d=document.createElement('textarea');d.innerHTML=s;return d.value};

async function one(q,f,t,signal){
  const url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(q)+'&langpair='+encodeURIComponent(f+'|'+t);
  const r=await fetch(url,{signal});
  if(!r.ok)throw {code:r.status===429?'quota':'http'};
  const j=await r.json();
  const s=j.responseData&&j.responseData.translatedText;
  if(String(j.responseStatus)==='429'||/MYMEMORY WARNING/i.test(s||''))throw {code:'quota'};
  if(String(j.responseStatus)!=='200'||!s)throw {code:'api'};
  return dec(s);
}

function drawHist(){
  const ul=$('hist');ul.textContent='';
  $('histbox').hidden=!hist.length;
  hist.forEach(h=>{
    const li=document.createElement('li'),b=document.createElement('button');
    b.textContent=String(h.s).replace(/\s+/g,' ').slice(0,60)+' → '+name(h.o);
    b.onclick=()=>{$('src').value=h.s;$('out').textContent=h.t;$('to').value=h.o;$('from').value=h.f;count();savePref();setSt('기록에서 불러왔습니다.')};
    li.append(b);ul.append(li);
  });
}

async function run(){
  const text=$('src').value.trim();
  if(!text){setSt('번역할 문장을 입력해 주세요.');$('src').focus();return}
  const sel=$('from').value,to=$('to').value;
  const from=sel==='auto'?detect(text):sel;
  if(from===to){setSt('원문 언어와 번역 언어가 같습니다. 다른 언어를 고르세요.');return}
  if(ctl)ctl.abort();
  const my=ctl=new AbortController();
  $('btn').disabled=true;$('out').textContent='';
  const parts=split(text);let res='';
  try{
    for(let i=0;i<parts.length;i++){
      setSt((sel==='auto'?'감지: '+name(from)+' · ':'')+'번역 중... ('+(i+1)+'/'+parts.length+')');
      const body=parts[i].replace(/\s+$/,''),tail=parts[i].slice(body.length);
      res+=(body?await one(body,from,to,my.signal):'')+tail;
      $('out').textContent=res;
    }
    res=res.trim();$('out').textContent=res;
    setSt(sel==='auto'?'완료 (감지: '+name(from)+')':'완료');
    hist=[{s:text,t:res,f:sel,o:to}].concat(hist.filter(h=>!(h.s===text&&h.o===to))).slice(0,8);
    store.set('hist',hist);drawHist();
  }catch(e){
    if(my.signal.aborted)return;
    setSt(e&&e.code==='quota'?'오늘 무료 이용량을 모두 썼습니다. 내일 다시 시도해 주세요.':e&&e.code==='api'?'번역 결과를 받지 못했습니다. 언어 선택을 확인하고 다시 시도해 주세요.':'번역 서비스에 연결하지 못했습니다. 인터넷 연결을 확인하고 다시 시도해 주세요.');
  }finally{if(ctl===my)$('btn').disabled=false}
}

$('btn').onclick=run;
$('src').addEventListener('input',count);
$('src').addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();if(!$('btn').disabled)run()}});
for(const id of ['from','to'])$(id).onchange=savePref;
$('clear').onclick=()=>{$('src').value='';$('out').textContent='';count();setSt('');$('src').focus()};
$('hclear').onclick=()=>{hist=[];store.set('hist',hist);drawHist()};
$('swap').onclick=()=>{
  const f=$('from').value;
  if(f==='auto'){setSt('원문 언어가 자동 감지일 때는 바꿀 수 없습니다. 원문 언어를 먼저 고르세요.');return}
  $('from').value=$('to').value;$('to').value=f;
  const o=$('out').textContent;if(o){$('src').value=o;$('out').textContent=''}
  count();savePref();
};
$('copy').onclick=async()=>{
  const t=$('out').textContent;if(!t){setSt('복사할 번역문이 없습니다.');return}
  try{await navigator.clipboard.writeText(t);setSt('복사했습니다.')}catch(e){setSt('복사가 막혀 있습니다. 번역문을 직접 선택해 복사하세요.')}
};
count();drawHist();
}
</script>
</body>
</html>
